---
# Role mode: parent (accepts streams, claims to cloud) or child (streams to parent)
netdata_mode: "child"

# NetData install method
netdata_install_method: "native-kickstart"

# NetData cloud claiming (parent mode only)
# Set via environment variable: NETDATA_CLAIM_TOKEN
netdata_claim_token: "{{ lookup('env', 'NETDATA_CLAIM_TOKEN') | default('') }}"
netdata_claim_rooms: "{{ lookup('env', 'NETDATA_CLAIM_ROOMS') | default('') }}"
netdata_claim_url: "https://app.netdata.cloud"

# Streaming configuration
# Parent accepts streams; children send to parent
netdata_parent_host: "monitoring.yiff.org"
netdata_parent_port: 19999
netdata_stream_api_key: "{{ lookup('env', 'NETDATA_STREAM_API_KEY') | default('') }}"

# NetData configuration
netdata_bind_to: "0.0.0.0:19999"
netdata_disable_cloud: true

# Auto-updates
netdata_auto_updates: true

# Memory optimization
netdata_memory_mode: "ram"
