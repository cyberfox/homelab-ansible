---
- name: Install NetData via official kickstart script
  when: netdata_install_method == "native-kickstart"
  block:
    - name: Check if NetData is already installed
      stat:
        path: /usr/sbin/netdata
      register: netdata_binary

    - name: Download and run NetData kickstart script
      shell: >
        curl -Ss https://get.netdata.cloud/kickstart.sh > /tmp/netdata-kickstart.sh &&
        sh /tmp/netdata-kickstart.sh
        --non-interactive
        --stable-channel
        --disable-cloud
        {% if netdata_auto_updates %}--auto-update{% else %}--disable-auto-updates{% endif %}
      args:
        creates: /usr/sbin/netdata
      when: not netdata_binary.stat.exists
      changed_when: false

    - name: Clean up kickstart script
      file:
        path: /tmp/netdata-kickstart.sh
        state: absent

- name: Configure NetData base settings
  copy:
    content: |
      [web]
        bind to = {{ netdata_bind_to }}
      [global]
        memory mode = {{ netdata_memory_mode }}
      {% if netdata_disable_cloud %}
      [cloud]
        enabled = no
      {% endif %}
    dest: /etc/netdata/netdata.conf.d/homelab.conf
    owner: root
    group: netdata
    mode: "0640"
  notify: Restart netdata

- name: Configure as parent node (accepts streams, claims to cloud)
  when: netdata_mode == "parent"
  block:
    - name: Assert claim token is set for parent mode
      assert:
        that:
          - netdata_claim_token | length > 0
        fail_msg: "NETDATA_CLAIM_TOKEN env var must be set for parent mode"

    - name: Assert stream API key is set for parent mode
      assert:
        that:
          - netdata_stream_api_key | length > 0
        fail_msg: "NETDATA_STREAM_API_KEY env var must be set for parent mode"

    - name: Configure streaming (accept connections from children)
      copy:
        content: |
          [API_KEY]
              {{ netdata_stream_api_key }} = child nodes

          [stream]
              enabled = yes
              accept a streaming connection from = *
              default history = 3600
              health enabled by default = yes
        dest: /etc/netdata/netdata.conf.d/stream.conf
        owner: root
        group: netdata
        mode: "0640"
      notify: Restart netdata

    - name: Write cloud claim configuration
      copy:
        content: |
          [global]
              url = {{ netdata_claim_url }}
              token = {{ netdata_claim_token }}
              {% if netdata_claim_rooms %}rooms = {{ netdata_claim_rooms }}{% endif %}
        dest: /etc/netdata/claim.conf
        owner: root
        group: netdata
        mode: "0640"
      notify: Reload claiming state

    - name: Reload cloud claiming state
      command: /usr/sbin/netdatacli reload-claiming-state
      changed_when: false

- name: Configure as child node (streams to parent)
  when: netdata_mode == "child"
  block:
    - name: Assert stream API key is set for child mode
      assert:
        that:
          - netdata_stream_api_key | length > 0
        fail_msg: "NETDATA_STREAM_API_KEY env var must be set for child mode"

    - name: Configure streaming to parent
      copy:
        content: |
          [stream]
              enabled = yes
              destination = {{ netdata_parent_host }}:{{ netdata_parent_port }}
              api key = {{ netdata_stream_api_key }}
          [plugins]
              enable looking glass = no
        dest: /etc/netdata/netdata.conf.d/stream.conf
        owner: root
        group: netdata
        mode: "0640"
      notify: Restart netdata

- name: Ensure NetData service is running
  service:
    name: netdata
    state: started
    enabled: true

- name: Configure firewall for NetData (ufw)
  community.general.ufw:
    rule: allow
    port: "19999"
    proto: tcp
    comment: "NetData monitoring"
  when: ansible_os_family == "Debian"
  ignore_errors: true
